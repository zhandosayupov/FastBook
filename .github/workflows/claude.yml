name: Claude review

# Запускается комментарием "@claude ..." в PR от владельца репозитория.
# Работает только из файла в main (так устроены события комментариев в GitHub).
# Нужен секрет CLAUDE_CODE_OAUTH_TOKEN (токен подписки, `claude setup-token`).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.author_association == 'OWNER' &&
        contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # чтобы Claude мог читать результаты CI в PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
